<main class="home-page">
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero__overlay"></div>

    <div class="hero__content">
      <p class="hero__eyebrow">Grupo Menéndez</p>
      <h1 id="hero-title">
        CONSTRUIMOS<br />
        PROYECTOS QUE<br />
        <span>GENERAN FUTURO</span>
      </h1>
      <p class="hero__description">
        Experiencia, infraestructura y soluciones especializadas para proyectos
        de construcción y obra.
      </p>

      <div class="hero__actions">
        <a class="button button--primary" routerLink="/servicios">
          Conoce nuestros servicios
        </a>
        <a class="button button--outline" routerLink="/contacto">
          Contáctanos
        </a>
      </div>
    </div>
  </section>

  <section class="metrics" aria-label="Métricas de Grupo Menéndez">
    @for (metric of metrics; track metric.label) {
      <div class="metric">
        <strong>{{ metric.value }}</strong>
        <span>{{ metric.label }}</span>
      </div>
    }
  </section>
</main>
